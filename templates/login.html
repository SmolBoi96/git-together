{% extends "base.html" %}
{% block title %}login · git-together{% endblock %}
{% block path %}login{% endblock %}
{% block mode %}INSERT{% endblock %}
{% block content %}
{% include "_banner.html" %}
<p class="out">$ ssh dev@git-together</p>
<form method="post" class="tty-form" autocomplete="on">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>login as: <input name="username" required autofocus autocomplete="username" spellcheck="false"></label>
  <label>password: <input name="password" type="password" required autocomplete="current-password"></label>
  <button type="submit" class="btn">[ enter ]</button>
</form>
<p class="comment">no account? <a href="{{ url_for('register') }}">sudo useradd</a></p>
{% endblock %}
